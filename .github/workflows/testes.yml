name: Testes Citizen Mobilidade

on:
  push:
    branches:
      - evolucao-v2
      - integracao/citizen-mobilidade
      - main
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      CITIZEN_MODO: teste
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Testes backend
        run: python -m pytest backend/tests -v
      - name: Avaliação acadêmica A/B
        run: |
          python -m backend.src.avaliacao_cidada
          cat docs/resultados_avaliacao_cidada.json
      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
